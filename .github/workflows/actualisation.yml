name: Actualisation calendrier lotoagenda

on:
  schedule:
    - cron: '17 * * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualisation:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperation du projet
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow pytesseract

      - name: Installation de la lecture des images
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra

      - name: Analyse des affiches
        run: python analyse_lotos.py

      - name: Enregistrement des resultats
        run: |
          git config user.name "Lotoagenda Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lotos.json
          git diff --cached --quiet || git commit -m "Actualisation des lotos"
          git push
